name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, iconv, libxml
          coverage: none

      - name: Lint (compile-time deprecations fail the build)
        run: |
          find getid3 demos tests -name '*.php' -print0 | xargs -0 -n1 php -d error_reporting=-1 -d display_errors=stdout -l 2>&1 | tee lint.log
          ! grep -E 'Deprecated|Warning|Parse error' lint.log

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit
